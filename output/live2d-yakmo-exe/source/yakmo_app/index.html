<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牦牦 Live2D 风格浏览器包</title>
    <link rel="stylesheet" href="runtime/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel" aria-label="牦牦 Live2D 风格预览">
        <canvas id="yakmo-stage" width="900" height="900"></canvas>
      </section>

      <aside class="control-panel">
        <div class="identity">
          <span class="kicker">Yakmo</span>
          <h1>牦牦</h1>
        </div>

        <div class="motion-grid" id="motion-grid" aria-label="动作切换">
          <button data-motion="idle" class="active">待机</button>
          <button data-motion="running-right">向右</button>
          <button data-motion="running-left">向左</button>
          <button data-motion="waving">挥手</button>
          <button data-motion="jumping">跳跃</button>
          <button data-motion="failed">失败</button>
          <button data-motion="waiting">等待</button>
          <button data-motion="running">处理</button>
          <button data-motion="review">复核</button>
        </div>

        <div class="meta-list">
          <div>
            <span>模式</span>
            <strong>Live2D-like Canvas</strong>
          </div>
          <div>
            <span>补帧</span>
            <strong>12-24 frames / motion</strong>
          </div>
          <div>
            <span>交互</span>
            <strong>Pointer follow + mesh sway</strong>
          </div>
        </div>
      </aside>
    </main>

    <script src="runtime/yakmo-live2d.js"></script>
    <script>
      const canvas = document.querySelector("#yakmo-stage");
      const buttons = [...document.querySelectorAll("[data-motion]")];
      const pet = new YakmoLive2D(canvas);

      pet.load("model/yakmo.live2d.json").then(() => {
        pet.start();
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          pet.setMotion(button.dataset.motion);
        });
      });
    </script>
  </body>
</html>
