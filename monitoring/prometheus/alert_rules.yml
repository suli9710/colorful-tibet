groups:
  - name: colorful-tibet.rules
    rules:
      - alert: BackendDown
        expr: up{job="colorful-tibet-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Colorful Tibet backend is down
          description: Prometheus cannot scrape the backend actuator endpoint.

      - alert: HighHttp5xxRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="colorful-tibet-backend",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="colorful-tibet-backend"}[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High backend 5xx error rate
          description: More than 5 percent of backend HTTP requests are returning 5xx over 5 minutes.

      - alert: HighHttpP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="colorful-tibet-backend"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High backend p95 latency
          description: Backend p95 HTTP latency is above 2 seconds for 5 minutes.
