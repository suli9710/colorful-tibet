global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: colorful-tibet-backend
    # Production compose keeps PUBLIC_METRICS_ENABLED=false by default.
    # Configure an authenticated or allowlisted scrape path before relying on this job.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
