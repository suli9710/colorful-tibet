global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: colorful-tibet-backend
    # NOTE: /actuator/prometheus is gated behind ROLE_ADMIN unless
    # PUBLIC_METRICS_ENABLED=true. docker-compose.prod.yml defaults it to FALSE
    # (secure default), so this scrape returns 401/403 until metrics exposure is
    # explicitly enabled behind a trusted/isolated network or auth proxy/mTLS.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
