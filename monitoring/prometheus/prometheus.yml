global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: colorful-tibet-backend
    # docker-compose.prod.yml defaults PUBLIC_METRICS_ENABLED=true so this
    # internal scrape can read /actuator/prometheus without an ADMIN JWT.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
