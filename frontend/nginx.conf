server {
    listen 80;
    server_name lengzhehao.xin www.lengzhehao.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lengzhehao.xin www.lengzhehao.xin;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/lengzhehao.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lengzhehao.xin/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lengzhehao.xin/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # vue-i18n compiles locale messages in the browser, which needs unsafe-eval unless messages are precompiled at build time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://webapi.amap.com https://*.amap.com https://*.autonavi.com; connect-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # API代理（使用 ^~ 确保优先匹配，不会被其他 location 规则覆盖）
    location ^~ /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间对齐后端 AI 生成（180s），额外留 30s 余量
        proxy_connect_timeout 30s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;

        # SSE 流式传输：关闭缓冲 + HTTP/1.1 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # 仅对明确的服务器错误做重试，超时不重试（避免 SSE 长连接误触发）
        proxy_next_upstream http_500 http_502 http_503;
        proxy_next_upstream_tries 1;
    }

    # Heritage 静态图片 — nginx 本地直接提供，^~ 优先级高于下面的 regex API 兼容规则
    location ^~ /heritage/ {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Vue Router 页面路径优先返回 SPA，避免被下面的旧版 API 兼容规则误代理成 JSON。
    location ~ ^/(spots/?|spots/[0-9]+/?|heritage/?|news/?|admin/?|route-planner/?|route/?|community/?|community/(question/)?[^/]+/?|create-route/?|profile/?|privacy/?|terms/?|hotels/?|hotels/[^/]+/?|hotel-booking/[^/]+/?|favorites/?|orders/?|hotel-orders/?)$ {
        try_files $uri $uri/ /index.html;
    }

    # 处理缺少 /api 前缀的 API 请求（兼容旧版本构建）
    location ~ ^/(spots|auth|news|heritage|routes|bookings|comments|admin|prices)(/|$) {
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;

        proxy_buffering off;
        proxy_cache off;

        proxy_next_upstream http_500 http_502 http_503;
        proxy_next_upstream_tries 1;
    }

    # 上传文件代理
    location ^~ /uploads {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传图片缓存
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # 图片资源代理
    location ^~ /images {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 图片缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由支持（Vue Router history模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/javascript
      application/x-javascript
      application/json
      application/xml
      application/xml+rss
      image/svg+xml
      font/woff2;
}
