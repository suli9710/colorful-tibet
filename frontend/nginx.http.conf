limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# If this nginx sits behind a CDN or load balancer, configure real_ip_header
# and narrow set_real_ip_from to those trusted upstream networks before relying
# on $remote_addr for rate limiting or forwarding.
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
# set_real_ip_from 10.0.0.0/8;

server {
    listen 8080;
    server_name ${NGINX_SERVER_NAME};
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com https://www.gstatic.cn; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://images.unsplash.com; connect-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://geo.datav.aliyun.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com; frame-src 'self' https://www.recaptcha.net https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /robots.txt {
        default_type text/plain;
        expires -1;
        try_files /robots.txt =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        expires -1;
        try_files /.well-known/security.txt =404;
    }

    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    location = /asset-missing.js {
        default_type application/javascript;
        expires -1;
        try_files /asset-missing.js =404;
    }

    location ^~ /api/auth/ {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location ~ ^/api/(routes/generate/(stream|jobs/[^/]+/stream)|route/stream|guide/chat/stream)$ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        add_header X-Accel-Buffering "no" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com https://www.gstatic.cn; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://images.unsplash.com; connect-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://geo.datav.aliyun.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com; frame-src 'self' https://www.recaptcha.net https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream http_500 http_502 http_503;
        proxy_next_upstream_tries 1;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location = /us-api {
        return 404;
    }

    location ^~ /us-api/ {
        return 404;
    }

    location = /heritage {
        expires -1;
        try_files /index.html =404;
    }

    location = /heritage/ {
        expires -1;
        try_files /index.html =404;
    }

    location ^~ /heritage/ {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        expires 7d;
    }

    location = /uploads {
        return 404;
    }

    location = /uploads/ {
        return 404;
    }

    location ^~ /uploads/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        add_header Cache-Control "private, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com https://www.gstatic.cn; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://images.unsplash.com; connect-src 'self' https://webapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://geo.datav.aliyun.com https://www.recaptcha.net https://www.google.com https://www.gstatic.com; frame-src 'self' https://www.recaptcha.net https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Content-Disposition "inline" always;
    }

    location = /images {
        return 404;
    }

    location = /images/ {
        return 404;
    }

    location ^~ /images/ {
        limit_except GET HEAD { deny all; }
        try_files $uri @backend_images;
        expires 30d;
    }

    location @backend_images {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;

        expires 30d;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location ~* ^/assets/.*\.js$ {
        limit_except GET HEAD { deny all; }
        try_files $uri /asset-missing.js;
        expires 1y;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_except GET HEAD { deny all; }
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/javascript
      application/x-javascript
      application/json
      application/xml
      application/xml+rss
      image/svg+xml
      font/woff2;
}
