services:
  mysql:
    image: mysql:8.4
    container_name: colorful-tibet-mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required; set a local-only random root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-colorful_tibet}
      MYSQL_USER: ${MYSQL_USERNAME:-colorful_tibet_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required; set a local-only app database password}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colorful-tibet-backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-colorful_tibet}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-colorful_tibet_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required; set a local-only app database password}
      - MYSQL_SSL_MODE=${MYSQL_SSL_MODE:-DISABLED}
      - MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      - ARK_API_KEY
      - ARK_API_URL
      - ARK_STREAM_API_URL
      - ARK_MODEL
      - AI_MODEL
      - AI_STREAM_TIMEOUT
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_API_URL=${DOUBAO_API_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      - DOUBAO_STREAM_API_URL
      - DOUBAO_MODEL=${DOUBAO_MODEL:-ep-20260516173036-4dpgm}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required; generate a private 64+ character value}
      - CSRF_SIGNING_SECRET=${CSRF_SIGNING_SECRET:?CSRF_SIGNING_SECRET is required; generate a private 64+ character value}
      - PII_KEYS=${PII_KEYS:?PII_KEYS is required; use kid:base64-32-byte-key format}
      - PII_ACTIVE_KID=${PII_ACTIVE_KID:?PII_ACTIVE_KID is required}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required; keep it private}
      - PII_MIGRATION_ENABLED=${PII_MIGRATION_ENABLED:-false}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY:?ADMIN_ENCRYPTION_KEY is required}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-lzh}
      - SUPER_ADMIN_TOTP_SECRET=${SUPER_ADMIN_TOTP_SECRET:?SUPER_ADMIN_TOTP_SECRET is required}
      - SEED_CONTENT_ENABLED=${SEED_CONTENT_ENABLED:-true}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-false}
      - SEED_DEMO_ADMIN_PASSWORD=${SEED_DEMO_ADMIN_PASSWORD:-}
      - SEED_DEMO_SUPER_ADMIN_PASSWORD=${SEED_DEMO_SUPER_ADMIN_PASSWORD:-}
      - SEED_DEMO_USER_PASSWORD=${SEED_DEMO_USER_PASSWORD:-}
      - REQUIRE_STRONG_SECRETS=${REQUIRE_STRONG_SECRETS:-false}
      - PUBLIC_DOCS_ENABLED=${PUBLIC_DOCS_ENABLED:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - PAYMENT_MOCK_CALLBACK_ENABLED=${PAYMENT_MOCK_CALLBACK_ENABLED:-true}
      - PAYMENT_CALLBACK_SECRET=${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILE_UPLOAD_DIR=${FILE_UPLOAD_DIR:-/app/data/uploads}
      - SCRAPLING_SERVICE_URL=${SCRAPLING_SERVICE_URL:-http://scrapling:8000}
      - SCRAPLING_SERVICE_TIMEOUT=${SCRAPLING_SERVICE_TIMEOUT:-30}
      - SCRAPLING_MAX_SOURCES=${SCRAPLING_MAX_SOURCES:-4}
      - SCRAPLING_MODE=${SCRAPLING_MODE:-basic}
      - SCRAPLING_HEALTH_ENABLED=${SCRAPLING_HEALTH_ENABLED:-true}
      - SCRAPLING_API_KEY=${SCRAPLING_API_KEY:-}
      - GUIDE_CHAT_ANONYMOUS_ENABLED=${GUIDE_CHAT_ANONYMOUS_ENABLED:-true}
      - GUIDE_CHAT_ANONYMOUS_DAILY_QUOTA_PER_IP=${GUIDE_CHAT_ANONYMOUS_DAILY_QUOTA_PER_IP:-5}
      - GUIDE_CHAT_AUTHENTICATED_DAILY_QUOTA_PER_USER=${GUIDE_CHAT_AUTHENTICATED_DAILY_QUOTA_PER_USER:-30}
      - GUIDE_CHAT_REQUIRE_RECAPTCHA_AFTER=${GUIDE_CHAT_REQUIRE_RECAPTCHA_AFTER:-2}
      - GUIDE_CHAT_ANON_REMOTE_AI_ENABLED=${GUIDE_CHAT_ANON_REMOTE_AI_ENABLED:-false}
      - IP_LOCATION_URL_TEMPLATE=${IP_LOCATION_URL_TEMPLATE:-https://ipapi.co/{ip}/json/}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      scrapling:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: colorful-tibet-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  scrapling:
    build:
      context: ./scrapler
      dockerfile: Dockerfile
    container_name: colorful-tibet-scrapling
    ports:
      - "127.0.0.1:${SCRAPLING_HOST_PORT:-8000}:8000"
    environment:
      - SCRAPLING_MODE=${SCRAPLING_MODE:-basic}
      - SCRAPLING_TIMEOUT_SECONDS=${SCRAPLING_TIMEOUT_SECONDS:-30}
      - SCRAPLING_RETRIES=${SCRAPLING_RETRIES:-2}
      - SCRAPLING_MAX_SOURCES=${SCRAPLING_MAX_SOURCES:-4}
      - SCRAPLING_SEARCH_PROVIDERS=${SCRAPLING_SEARCH_PROVIDERS:-baidu,bing}
      - SCRAPLING_ALLOWED_DOMAINS=${SCRAPLING_ALLOWED_DOMAINS:-}
      - SCRAPLING_PROXY_URL=${SCRAPLING_PROXY_URL:-}
      - SCRAPLING_SOLVE_CLOUDFLARE=${SCRAPLING_SOLVE_CLOUDFLARE:-false}
      - SCRAPLING_API_KEY=${SCRAPLING_API_KEY:-}
      - SCRAPLING_MAX_CONCURRENCY=${SCRAPLING_MAX_CONCURRENCY:-2}
      - SCRAPLING_ALLOW_REQUEST_MODE_OVERRIDE=${SCRAPLING_ALLOW_REQUEST_MODE_OVERRIDE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_RECAPTCHA_ENABLED=${VITE_RECAPTCHA_ENABLED:-${RECAPTCHA_ENABLED:-false}}
        - VITE_RECAPTCHA_MODE=${VITE_RECAPTCHA_MODE:-v2}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-${RECAPTCHA_SITE_KEY:-}}
        - VITE_AMAP_KEY=${VITE_AMAP_KEY:-}
        - VITE_AMAP_SECURITY_CODE=${VITE_AMAP_SECURITY_CODE:-}
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - NGINX_CERT_DOMAIN=${NGINX_CERT_DOMAIN:-localhost}
      - NGINX_HTTP_ONLY=true
    container_name: colorful-tibet-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mysql_data:
  redis_data:
