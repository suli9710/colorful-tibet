services:
  mysql:
    image: mysql:8.4
    container_name: colorful-tibet-mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      MYSQL_ROOT_HOST: "${MYSQL_ROOT_HOST:-%}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-colorful_tibet}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colorful-tibet-backend
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-colorful_tibet}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123456}
      - ARK_API_KEY
      - ARK_API_URL
      - ARK_STREAM_API_URL
      - ARK_MODEL
      - AI_MODEL
      - AI_STREAM_TIMEOUT
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_API_URL=${DOUBAO_API_URL:-https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      - DOUBAO_STREAM_API_URL
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-2-0-pro-260215}
      - JWT_SECRET=${JWT_SECRET:-dev-only-jwt-secret-change-me-before-any-shared-deployment-2026}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY:-dev-only-admin-key-change-me-before-any-shared-deployment-2026}
      - REQUIRE_STRONG_SECRETS=${REQUIRE_STRONG_SECRETS:-false}
      - PUBLIC_DOCS_ENABLED=${PUBLIC_DOCS_ENABLED:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPLING_SERVICE_URL=${SCRAPLING_SERVICE_URL:-http://scrapling:8000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      scrapling:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s  # 启动宽限期，允许后端在 600 秒内启动
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: colorful-tibet-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  scrapling:
    build:
      context: ./scrapler
      dockerfile: Dockerfile
    container_name: colorful-tibet-scrapling
    ports:
      - "127.0.0.1:${SCRAPLING_HOST_PORT:-8000}:8000"
    environment:
      - SCRAPLING_MODE=${SCRAPLING_MODE:-basic}
      - SCRAPLING_TIMEOUT_SECONDS=${SCRAPLING_TIMEOUT_SECONDS:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: colorful-tibet-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mysql_data:
  redis_data:
