spring:
  datasource:
    url: jdbc:mysql://${MYSQL_TEST_HOST:${MYSQL_HOST:localhost}}:${MYSQL_TEST_PORT:${MYSQL_PORT:3306}}/${MYSQL_TEST_DATABASE:colorful_tibet_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_TEST_USERNAME:${MYSQL_USERNAME:root}}
    password: ${MYSQL_TEST_PASSWORD:${MYSQL_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: never

jwt:
  secret: test-jwt-secret-key-for-unit-tests-only-1234567890
  expiration: 86400000

app:
  security:
    public-docs-enabled: false
    require-strong-secrets: false

logging:
  level:
    com.tibet.tourism: DEBUG
    org.hibernate.SQL: WARN
