spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: never

app:
  jwt-secret: test-jwt-secret-key-for-unit-tests-only-1234567890
  jwt-expiration-ms: 86400000

logging:
  level:
    com.tibet.tourism: DEBUG
    org.hibernate.SQL: WARN
