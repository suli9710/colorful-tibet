spring:
  datasource:
    url: jdbc:mysql://${MYSQL_TEST_HOST:${MYSQL_HOST:localhost}}:${MYSQL_TEST_PORT:${MYSQL_PORT:3306}}/${MYSQL_TEST_DATABASE:colorful_tibet_test}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_TEST_SSL_MODE:DISABLED}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${MYSQL_TEST_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_TEST_USERNAME:${MYSQL_USERNAME:colorful_tibet_app}}
    password: ${MYSQL_TEST_PASSWORD:${MYSQL_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

jwt:
  secret: test-jwt-secret-key-for-unit-tests-only-1234567890-abcdef-abcdef-abcdef
  expiration: 86400000

app:
  security:
    public-docs-enabled: false
    require-strong-secrets: false
    totp-replay-fail-closed: false
    csrf-signing-secret: test-csrf-signing-secret-for-unit-tests-only-1234567890-abcdef-abcdef-abcdef
    pii-keys: kid-test:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    pii-active-kid: kid-test
    pii-encryption-key: test-pii-encryption-key-for-unit-tests-only-1234567890-abcdef-abcdef
    rate-limit:
      redis-enabled: false

logging:
  level:
    com.tibet.tourism: DEBUG
    org.hibernate.SQL: WARN
