server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: colorful-tibet-tourism
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 120000  # 120秒异步请求超时，适应AI生成时间
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:colorful_tibet}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_SSL_MODE:VERIFY_CA}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TibetMySQLPool
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # JPA 批量处理优化
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:500}
  flyway:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.hibernate.SQL_SLOW: WARN

springdoc:
  packages-to-scan: com.tibet.tourism.controller
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

# JWT配置（必须与登录时使用的密钥一致）
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-before-any-shared-deployment-2026}
  expiration: 86400000  # 24小时

ark:
  api:
    url: ${ARK_API_URL:${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}}
    key: ${ARK_API_KEY:${DOUBAO_API_KEY:}}
    model: ${AI_MODEL:${ARK_MODEL:${DOUBAO_MODEL:doubao-seed-2-0-pro-260215}}}
    stream-url: ${ARK_STREAM_API_URL:${DOUBAO_STREAM_API_URL:}}  # 流式端点，为空时从url自动推导

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
    model: ${DOUBAO_MODEL:${AI_MODEL:doubao-seed-2-0-pro-260215}}
    stream-url: ${DOUBAO_STREAM_API_URL:}

ai:
  route:
    timeout-seconds: 180
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# Scrapling 爬虫微服务配置
scrapling:
  service:
    url: ${SCRAPLING_SERVICE_URL:}
    timeout-seconds: ${SCRAPLING_SERVICE_TIMEOUT:30}
    max-sources: ${SCRAPLING_MAX_SOURCES:4}
    mode: ${SCRAPLING_MODE:}
    health-enabled: ${SCRAPLING_HEALTH_ENABLED:false}

# 价格定时更新配置
price:
  update:
    enabled: true  # 是否启用定时更新（设为false可禁用）
    force: false   # 是否强制更新已有价格的景点（默认false，只更新没有价格的）
    cron: "0 0 2 * * ?"  # 每天凌晨2点执行（Cron表达式）
    weekly:
      cron: "0 0 3 ? * MON"  # 每周一凌晨3点强制更新
    hourly:
      cron: "0 0 * * * ?"  # 每小时执行一次（仅更新缺失价格的景点）

recommendation:
  item-similarity:
    enabled: true
    preload-on-startup: true
    cron: "0 30 3 * * ?"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  security:
    public-docs-enabled: ${PUBLIC_DOCS_ENABLED:false}
    public-metrics-enabled: ${PUBLIC_METRICS_ENABLED:false}
    require-strong-secrets: ${REQUIRE_STRONG_SECRETS:true}
    csrf-signing-secret: ${CSRF_SIGNING_SECRET:dev-only-csrf-signing-secret-change-me-before-shared-deployment-2026-05-colorful-tibet}
    pii-encryption-key: ${PII_ENCRYPTION_KEY:}
    cookie-secure: ${COOKIE_SECURE:true}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    super-admin-bind-on-first-login: ${SUPER_ADMIN_BIND_ON_FIRST_LOGIN:true}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
      trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
      default:
        requests: ${RATE_LIMIT_DEFAULT_REQUESTS:300}
        window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
      auth:
        requests: ${RATE_LIMIT_AUTH_REQUESTS:12}
        window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
      register:
        requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
      ai:
        requests: ${RATE_LIMIT_AI_REQUESTS:6}
        window-seconds: ${RATE_LIMIT_AI_WINDOW_SECONDS:600}
      upload:
        requests: ${RATE_LIMIT_UPLOAD_REQUESTS:30}
        window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}
      admin:
        requests: ${RATE_LIMIT_ADMIN_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}
    ai-quota:
      daily-limit: ${AI_DAILY_QUOTA_PER_USER:20}
      cache-ttl-seconds: ${AI_CACHE_TTL_SECONDS:300}
    brute-force:
      enabled: ${BRUTE_FORCE_ENABLED:true}
      max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:5}
      redis-enabled: ${BRUTE_FORCE_REDIS_ENABLED:true}
      exempt-usernames: ${BRUTE_FORCE_EXEMPT_USERNAMES:}
    antibot:
      enabled: ${ANTIBOT_ENABLED:false}
      recaptcha:
        enabled: ${RECAPTCHA_ENABLED:false}
        site-key: ${RECAPTCHA_SITE_KEY:}
        secret-key: ${RECAPTCHA_SECRET_KEY:}
        min-score: ${RECAPTCHA_MIN_SCORE:0.5}
        verify-url: ${RECAPTCHA_VERIFY_URL:https://www.recaptcha.net/recaptcha/api/siteverify}
      fingerprint:
        enabled: ${FINGERPRINT_ENABLED:false}
        max-users-per-fingerprint: 5
        max-fingerprints-per-user: 10
        ttl-seconds: 86400
      behavior:
        enabled: ${BEHAVIOR_ENABLED:false}
        max-straightness-ratio: 0.95
        min-speed-std-dev: 0.5
        min-interval-std-dev: 5.0
      risk:
        recaptcha-weight: 0.3
        behavior-weight: 0.4
        fingerprint-weight: 0.3
        challenge-threshold: 60
        block-threshold: 85
  payments:
    mock-callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-payment-callback-secret}
  super-admin-username: ${SUPER_ADMIN_USERNAME:lzh}
  seed:
    content:
      enabled: ${SEED_CONTENT_ENABLED:true}
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
      admin-password: ${SEED_DEMO_ADMIN_PASSWORD:}
      super-admin-password: ${SEED_DEMO_SUPER_ADMIN_PASSWORD:}
      user-password: ${SEED_DEMO_USER_PASSWORD:}
