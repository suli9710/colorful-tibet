server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  profiles:
    active: local
  application:
    name: colorful-tibet-tourism
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 120000  # 120秒异步请求超时，适应AI生成时间
  datasource:
    # 默认使用固定路径的 H2 文件数据库，避免重启后数据丢失
    url: jdbc:h2:file:./data/h2/tibet_tourism;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    # HikariCP 连接池配置（适配 H2 数据库）
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TibetH2Pool
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # JPA 批量处理优化
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

# JWT配置（必须与登录时使用的密钥一致）
jwt:
  secret: ${JWT_SECRET:tibetTourismSecretKey12345678901234567890}
  expiration: 86400000  # 24小时

ark:
  api:
    url: ${ARK_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
    key: ${ARK_API_KEY:}
    model: ${AI_MODEL:doubao-seed-2-0-pro-260215}
    stream-url: ${ARK_STREAM_API_URL:}  # 流式端点，为空时从url自动推导

ai:
  route:
    timeout-seconds: 180
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# 价格定时更新配置
price:
  update:
    enabled: true  # 是否启用定时更新（设为false可禁用）
    force: false   # 是否强制更新已有价格的景点（默认false，只更新没有价格的）
    cron: "0 0 2 * * ?"  # 每天凌晨2点执行（Cron表达式）
    weekly:
      cron: "0 0 3 ? * MON"  # 每周一凌晨3点强制更新
    hourly:
      cron: "0 0 * * * ?"  # 每小时执行一次（仅更新缺失价格的景点）

app:
  super-admin-username: ${SUPER_ADMIN_USERNAME:lzh}
  seed:
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
