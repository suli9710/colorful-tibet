server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: colorful-tibet-tourism
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 120000  # 120秒异步请求超时，适应AI生成时间
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:colorful_tibet}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TibetMySQLPool
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # JPA 批量处理优化
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:500}
  flyway:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.hibernate.SQL_SLOW: WARN

springdoc:
  packages-to-scan: com.tibet.tourism.controller
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

# JWT配置（必须与登录时使用的密钥一致）
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-before-any-shared-deployment-2026}
  expiration: 86400000  # 24小时

ark:
  api:
    url: ${ARK_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
    key: ${ARK_API_KEY:${DOUBAO_API_KEY:}}
    model: ${AI_MODEL:${DOUBAO_MODEL:doubao-seed-2-0-pro-260215}}
    stream-url: ${ARK_STREAM_API_URL:}  # 流式端点，为空时从url自动推导

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
    model: ${DOUBAO_MODEL:${AI_MODEL:doubao-seed-2-0-pro-260215}}
    stream-url: ${DOUBAO_STREAM_API_URL:}

ai:
  route:
    timeout-seconds: 180
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# 价格定时更新配置
price:
  update:
    enabled: true  # 是否启用定时更新（设为false可禁用）
    force: false   # 是否强制更新已有价格的景点（默认false，只更新没有价格的）
    cron: "0 0 2 * * ?"  # 每天凌晨2点执行（Cron表达式）
    weekly:
      cron: "0 0 3 ? * MON"  # 每周一凌晨3点强制更新
    hourly:
      cron: "0 0 * * * ?"  # 每小时执行一次（仅更新缺失价格的景点）

recommendation:
  item-similarity:
    enabled: true
    preload-on-startup: true
    cron: "0 30 3 * * ?"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  security:
    public-docs-enabled: ${PUBLIC_DOCS_ENABLED:false}
    require-strong-secrets: ${REQUIRE_STRONG_SECRETS:false}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      default:
        requests: ${RATE_LIMIT_DEFAULT_REQUESTS:300}
        window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
      auth:
        requests: ${RATE_LIMIT_AUTH_REQUESTS:12}
        window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
      ai:
        requests: ${RATE_LIMIT_AI_REQUESTS:6}
        window-seconds: ${RATE_LIMIT_AI_WINDOW_SECONDS:600}
      upload:
        requests: ${RATE_LIMIT_UPLOAD_REQUESTS:30}
        window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}
      admin:
        requests: ${RATE_LIMIT_ADMIN_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}
  super-admin-username: ${SUPER_ADMIN_USERNAME:lzh}
  seed:
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
      admin-password: ${SEED_DEMO_ADMIN_PASSWORD:AdminDemo2026}
      user-password: ${SEED_DEMO_USER_PASSWORD:UserDemo2026}
