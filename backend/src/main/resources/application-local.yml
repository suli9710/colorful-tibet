# 本地部署配置（MySQL）
# 使用方式：先启动 MySQL，创建数据库 colorful_tibet，并设置 MYSQL_PASSWORD。

server:
  port: 8080
  address: 0.0.0.0  # 允许局域网访问
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: colorful-tibet-tourism
  mvc:
    async:
      request-timeout: 120000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:colorful_tibet}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TibetMySQLPool
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:500}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          min-idle: 0
          max-active: 8
          max-idle: 4
          max-wait: 2000ms

ark:
  api:
    url: ${ARK_API_URL:${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}}
    key: ${ARK_API_KEY:${DOUBAO_API_KEY:}}
    model: ${AI_MODEL:${ARK_MODEL:${DOUBAO_MODEL:doubao-seed-2-0-mini-260428}}}
    stream-url: ${ARK_STREAM_API_URL:${DOUBAO_STREAM_API_URL:}}  # 流式端点，为空时从url自动推导

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
    model: ${DOUBAO_MODEL:${AI_MODEL:doubao-seed-2-0-mini-260428}}
    stream-url: ${DOUBAO_STREAM_API_URL:}

ai:
  route:
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# Scrapling 爬虫微服务配置
scrapling:
  service:
    url: ${SCRAPLING_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${SCRAPLING_SERVICE_TIMEOUT:30}
    max-sources: ${SCRAPLING_MAX_SOURCES:4}
    mode: ${SCRAPLING_MODE:basic}
    health-enabled: ${SCRAPLING_HEALTH_ENABLED:false}

# 价格定时更新配置
price:
  update:
    enabled: true
    force: false
    cron: "0 0 2 * * ?"
    weekly:
      cron: "0 0 3 ? * MON"
    hourly:
      cron: "0 0 * * * ?"

# JWT配置
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-before-any-shared-deployment-2026}
  expiration: 86400000  # 24小时

# 演示用户播种
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  security:
    public-docs-enabled: ${PUBLIC_DOCS_ENABLED:true}
    public-metrics-enabled: ${PUBLIC_METRICS_ENABLED:false}
    require-strong-secrets: ${REQUIRE_STRONG_SECRETS:false}
    csrf-signing-secret: ${CSRF_SIGNING_SECRET:dev-only-csrf-signing-secret-change-me-before-shared-deployment-2026-05-colorful-tibet}
    pii-encryption-key: ${PII_ENCRYPTION_KEY:}
    cookie-secure: ${COOKIE_SECURE:false}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    super-admin-secondary-password: ${SUPER_ADMIN_SECONDARY_PASSWORD:lzh031224}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
      trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
      register:
        requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
  payments:
    mock-callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-payment-callback-secret}
  super-admin-username: ${SUPER_ADMIN_USERNAME:lzh}
  seed:
    content:
      enabled: ${SEED_CONTENT_ENABLED:true}
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
      admin-password: ${SEED_DEMO_ADMIN_PASSWORD:}
      super-admin-password: ${SEED_DEMO_SUPER_ADMIN_PASSWORD:031224}
      user-password: ${SEED_DEMO_USER_PASSWORD:}

recommendation:
  item-similarity:
    preload-on-startup: false

# 日志配置
logging:
  level:
    root: INFO
    com.tibet.tourism: INFO
    org.hibernate.SQL_SLOW: WARN
  file:
    name: ./logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
