# 本地部署配置（默认连接 MySQL）
# 使用方式：
# 1. 先启动 MySQL，并创建数据库：colorful_tibet
# 2. 配置环境变量或直接修改下面的连接信息
# 3. 启动时使用：java -jar app.jar --spring.profiles.active=local

server:
  port: 8080
  address: 0.0.0.0  # 允许局域网访问

spring:
  application:
    name: colorful-tibet-tourism
  mvc:
    async:
      request-timeout: 120000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:colorful_tibet}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 可选：如果你仍想临时使用 H2，可把上面的 datasource 改回 H2 配置

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    key: ${DOUBAO_API_KEY:your-doubao-api-key}
    model: ${DOUBAO_MODEL:your-model-name}

# 价格定时更新配置
price:
  update:
    enabled: true
    force: false
    cron: "0 0 2 * * ?"
    weekly:
      cron: "0 0 3 ? * MON"
    hourly:
      cron: "0 0 * * * ?"

# JWT配置
jwt:
  secret: ${JWT_SECRET:tibetTourismSecretKey12345678901234567890}
  expiration: 86400000  # 24小时

# 密码加密配置 + H2 -> MySQL 一次性迁移开关
app:
  encryption:
    key: ${ADMIN_ENCRYPTION_KEY:tibetTourismSecretKey12345678901234567890}
  migration:
    h2-to-mysql:
      enabled: ${H2_TO_MYSQL_MIGRATION_ENABLED:false}
      h2-url: ${H2_MIGRATION_URL:jdbc:h2:file:./data/h2/tibet_tourism;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
      h2-username: ${H2_MIGRATION_USERNAME:sa}
      h2-password: ${H2_MIGRATION_PASSWORD:}
      skip-non-empty-table: ${H2_TO_MYSQL_SKIP_NON_EMPTY_TABLE:true}

# 日志配置
logging:
  level:
    root: INFO
    com.tibet.tourism: INFO
  file:
    name: ./logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
