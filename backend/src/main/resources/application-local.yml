# 本地部署配置（MySQL）
# 使用方式：先启动 MySQL，创建数据库 colorful_tibet，并设置 MYSQL_PASSWORD。

server:
  port: 8080
  address: 0.0.0.0  # 允许局域网访问
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: colorful-tibet-tourism
  mvc:
    async:
      request-timeout: 120000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:colorful_tibet}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${MYSQL_USERNAME:colorful_tibet_app}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TibetMySQLPool
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:500}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          min-idle: 0
          max-active: 8
          max-idle: 4
          max-wait: 2000ms

ark:
  api:
    url: ${ARK_API_URL:${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}}
    key: ${ARK_API_KEY:${DOUBAO_API_KEY:}}
    model: ${AI_MODEL:${ARK_MODEL:${DOUBAO_MODEL:ep-20260516173036-4dpgm}}}
    stream-url: ${ARK_STREAM_API_URL:${DOUBAO_STREAM_API_URL:}}  # 流式端点，为空时从url自动推导

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
    key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
    model: ${DOUBAO_MODEL:${AI_MODEL:ep-20260516173036-4dpgm}}
    stream-url: ${DOUBAO_STREAM_API_URL:}

ai:
  route:
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# Scrapling 爬虫微服务配置
scrapling:
  service:
    url: ${SCRAPLING_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${SCRAPLING_SERVICE_TIMEOUT:30}
    max-sources: ${SCRAPLING_MAX_SOURCES:4}
    mode: ${SCRAPLING_MODE:basic}
    health-enabled: ${SCRAPLING_HEALTH_ENABLED:false}
    api-key: ${SCRAPLING_API_KEY:}

# 价格定时更新配置
price:
  update:
    enabled: true
    force: false
    cron: "0 0 2 * * ?"
    weekly:
      cron: "0 0 3 ? * MON"
    hourly:
      cron: "0 0 * * * ?"

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24小时
  issuer: ${JWT_ISSUER:colorful-tibet-local}
  audience: ${JWT_AUDIENCE:colorful-tibet-web}

# 演示用户播种
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  security:
    public-docs-enabled: ${PUBLIC_DOCS_ENABLED:true}
    public-metrics-enabled: ${PUBLIC_METRICS_ENABLED:false}
    require-strong-secrets: ${REQUIRE_STRONG_SECRETS:false}
    registration-recaptcha-required: ${REGISTRATION_RECAPTCHA_REQUIRED:false}
    hotel-booking-pii-read-usernames: ${HOTEL_BOOKING_PII_READ_USERNAMES:${SUPER_ADMIN_USERNAME:}}
    csrf-signing-secret: ${CSRF_SIGNING_SECRET:}
    cache-key-hmac-secret: ${CACHE_KEY_HMAC_SECRET:}
    pii-keys: ${PII_KEYS:}
    pii-active-kid: ${PII_ACTIVE_KID:}
    pii-encryption-key: ${PII_ENCRYPTION_KEY:}
    pii-migration-enabled: ${PII_MIGRATION_ENABLED:false}
    cookie-secure: ${COOKIE_SECURE:false}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    super-admin-totp-secret: ${SUPER_ADMIN_TOTP_SECRET:}
    admin-totp-secrets: ${ADMIN_TOTP_SECRETS:}
    totp-replay-fail-closed: ${TOTP_REPLAY_FAIL_CLOSED:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
      redis-fail-closed: ${RATE_LIMIT_REDIS_FAIL_CLOSED:false}
      trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
      trusted-proxy-cidrs: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:${TRUSTED_PROXY_CIDRS:}}
      register:
        requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    guide-chat:
      anonymous-enabled: ${GUIDE_CHAT_ANONYMOUS_ENABLED:true}
      anonymous-daily-quota-per-ip: ${GUIDE_CHAT_ANONYMOUS_DAILY_QUOTA_PER_IP:5}
      authenticated-daily-quota-per-user: ${GUIDE_CHAT_AUTHENTICATED_DAILY_QUOTA_PER_USER:30}
      require-recaptcha-after: ${GUIDE_CHAT_REQUIRE_RECAPTCHA_AFTER:2}
      anonymous-remote-ai-enabled: ${GUIDE_CHAT_ANON_REMOTE_AI_ENABLED:false}
  payments:
    mock-callback-enabled: ${PAYMENT_MOCK_CALLBACK_ENABLED:true}
    mock-callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-payment-callback-secret}
  super-admin-username: ${SUPER_ADMIN_USERNAME:}
  seed:
    content:
      enabled: ${SEED_CONTENT_ENABLED:true}
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
      admin-password: ${SEED_DEMO_ADMIN_PASSWORD:}
      super-admin-password: ${SEED_DEMO_SUPER_ADMIN_PASSWORD:}
      user-password: ${SEED_DEMO_USER_PASSWORD:}

recommendation:
  item-similarity:
    preload-on-startup: false

# 日志配置
logging:
  level:
    root: INFO
    com.tibet.tourism: INFO
    org.hibernate.SQL_SLOW: WARN
  file:
    name: ./logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
