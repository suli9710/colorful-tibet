# 生产环境配置示例
# 使用方式：在启动时添加 -Dspring.profiles.active=prod

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: colorful-tibet-tourism
  mvc:
    async:
      request-timeout: 120000
  datasource:
    url: jdbc:mysql://localhost:3306/tibet_tourism?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:tibet_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# 日志配置
logging:
  level:
    root: INFO
    com.tibet.tourism: INFO
  file:
    name: /opt/colorful-tibet/logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# AI API 配置，ARK_* 优先，兼容旧的 DOUBAO_* 环境变量
ark:
  api:
    url: ${ARK_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
    key: ${ARK_API_KEY:${DOUBAO_API_KEY:}}
    model: ${AI_MODEL:${DOUBAO_MODEL:doubao-seed-2-0-pro-260215}}
    stream-url: ${ARK_STREAM_API_URL:}  # 流式端点，为空时从url自动推导

doubao:
  api:
    url: ${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
    model: ${DOUBAO_MODEL:${AI_MODEL:doubao-seed-2-0-pro-260215}}
    stream-url: ${DOUBAO_STREAM_API_URL:}

ai:
  route:
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT:180}

# 价格定时更新配置
price:
  update:
    enabled: true
    force: false
    cron: "0 0 2 * * ?"
    weekly:
      cron: "0 0 3 ? * MON"
    hourly:
      cron: "0 0 * * * ?"

# JWT配置（如果需要）
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时






