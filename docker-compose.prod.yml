version: '3.8'

# 生产环境 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colorful-tibet-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod  # 使用生产环境配置
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      - ARK_API_KEY
      - ARK_API_URL
      - ARK_STREAM_API_URL
      - ARK_MODEL
      - AI_MODEL
      - AI_STREAM_TIMEOUT=${AI_STREAM_TIMEOUT:-180}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY}
      - DOUBAO_API_URL=${DOUBAO_API_URL}
      - DOUBAO_STREAM_API_URL=${DOUBAO_STREAM_API_URL:-}
      - DOUBAO_MODEL=${DOUBAO_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY}
      - CSRF_SIGNING_SECRET=${CSRF_SIGNING_SECRET}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - REQUIRE_STRONG_SECRETS=${REQUIRE_STRONG_SECRETS:-true}
      - PUBLIC_DOCS_ENABLED=${PUBLIC_DOCS_ENABLED:-false}
      - SEED_CONTENT_ENABLED=${SEED_CONTENT_ENABLED:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SERVER_FORWARD_HEADERS_STRATEGY=${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME}
      # MySQL 数据库配置（如果使用 MySQL）
      - DB_USERNAME=${DB_USERNAME:-tibet_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-tibet_tourism}
      - DB_SSL_MODE=${DB_SSL_MODE:-DISABLED}
      - DB_ALLOW_PUBLIC_KEY_RETRIEVAL=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - RECOMMENDATION_ITEM_SIMILARITY_PRELOAD_ON_STARTUP=${RECOMMENDATION_ITEM_SIMILARITY_PRELOAD_ON_STARTUP:-false}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-0.1}
      - SCRAPLING_SERVICE_URL=${SCRAPLING_SERVICE_URL:-http://scrapling:8000}
      - ANTIBOT_ENABLED=${ANTIBOT_ENABLED:-false}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED:-false}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - FINGERPRINT_ENABLED=${FINGERPRINT_ENABLED:-false}
      - BEHAVIOR_ENABLED=${BEHAVIOR_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      scrapling:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - tibet-network

  redis:
    image: redis:7-alpine
    container_name: colorful-tibet-redis
    command: >
      redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - tibet-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mysql:
    image: mysql:8.4
    container_name: colorful-tibet-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-tibet_tourism}
      - MYSQL_USER=${DB_USERNAME:-tibet_user}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - tibet-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  scrapling:
    build:
      context: ./scrapler
      dockerfile: Dockerfile
    container_name: colorful-tibet-scrapling
    environment:
      - SCRAPLING_MODE=${SCRAPLING_MODE:-stealth}
      - SCRAPLING_TIMEOUT_SECONDS=${SCRAPLING_TIMEOUT_SECONDS:-30}
    restart: unless-stopped
    networks:
      - tibet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: colorful-tibet-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - tibet-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: colorful-tibet-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tibet-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: colorful-tibet-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - tibet-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: colorful-tibet-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in production}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tibet-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: colorful-tibet-zipkin
    ports:
      - "127.0.0.1:9411:9411"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tibet-network

  # MySQL 数据库（可选，如果使用 MySQL）
  # mysql:
  #   image: mysql:8.0
  #   container_name: colorful-tibet-mysql
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
  #     - MYSQL_DATABASE=tibet_tourism
  #     - MYSQL_USER=tibet_user
  #     - MYSQL_PASSWORD=${DB_PASSWORD}
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   ports:
  #     - "3306:3306"
  #   restart: unless-stopped
  #   networks:
  #     - tibet-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  tibet-network:
    driver: bridge

volumes:
  redis_data:
  mysql_data:
  prometheus_data:
  grafana_data:






