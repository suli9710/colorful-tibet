name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  repository-noise:
    name: Repository noise guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked generated files
        run: |
          set -euo pipefail
          noise_pattern='(^output/|^scrapler/\.venv/|(^|/)__pycache__/|\.pyc$|\.log$|(^|/)新建 文本文档\.txt$)'
          mapfile -t forbidden < <(git ls-files | grep -E "$noise_pattern" || true)
          if [ "${#forbidden[@]}" -gt 0 ]; then
            echo "::error title=Repository noise guard::Tracked generated/local-only files found"
            cat <<'EOF'
Repository noise guard failed.

Tracked paths must not match generated or local-only patterns:
  - output/
  - scrapler/.venv/
  - __pycache__/
  - *.pyc
  - *.log
  - 新建 文本文档.txt

Blocked tracked paths:
EOF
            printf '  - %s\n' "${forbidden[@]}"
            echo "Remove these paths from Git and keep them covered by .gitignore."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Flyway migration files
        run: |
          set -euo pipefail
          files="$(find src/main/resources/db/migration -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort -V)"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^V[0-9]+__[A-Za-z0-9_]+\.sql$' || true)"
          if [ -n "$invalid" ]; then
            echo "Invalid Flyway migration names:"
            printf '%s\n' "$invalid"
            exit 1
          fi
          duplicates="$(printf '%s\n' "$files" | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate Flyway migration versions:"
            printf 'V%s\n' $duplicates
            exit 1
          fi

      - name: Test backend
        run: mvn -q test

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  scrapler:
    name: Scrapler tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scrapler/requirements.txt
            scrapler/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test scrapler
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test frontend
        run: npm run test -- --run

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build
        run: npm run build

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker-images:
    name: Docker image build and scan
    runs-on: ubuntu-latest
    needs:
      - backend
      - scrapler
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t colorful-tibet-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t colorful-tibet-frontend:ci ./frontend

      - name: Build scrapler image
        run: docker build -t colorful-tibet-scrapler:ci ./scrapler

      - name: Prepare SBOM output
        run: mkdir -p sbom

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan scrapler image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-scrapler:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-backend:ci
          format: cyclonedx
          output: sbom/backend.cdx.json

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-frontend:ci
          format: cyclonedx
          output: sbom/frontend.cdx.json

      - name: Generate scrapler SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: colorful-tibet-scrapler:ci
          format: cyclonedx
          output: sbom/scrapler.cdx.json

      - name: Upload image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: sbom/*.cdx.json
          retention-days: 30
