name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  repository-noise:
    name: Repository noise guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Reject tracked generated files
        run: |
          set -euo pipefail
          noise_pattern='(^output/|^scrapler/\.venv/|(^|/)__pycache__/|\.pyc$|\.log$|(^|/)新建 文本文档\.txt$)'
          extra_noise_patterns="$(mktemp)"
          cat > "$extra_noise_patterns" <<'EOF'
          ^"[^/]*$
          ^'[^/]*$
          ^"?%s[^/]*$
          ^[^/]*;[^/]*$
          EOF
          mapfile -t forbidden < <({ git ls-files | grep -E "$noise_pattern" || true; git ls-files | grep -E -f "$extra_noise_patterns" || true; } | sort -u)
          if [ "${#forbidden[@]}" -gt 0 ]; then
            echo "::error title=Repository noise guard::Tracked generated/local-only files found"
            cat <<'EOF'
          Repository noise guard failed.

          Tracked paths must not match generated or local-only patterns:
            - output/
            - scrapler/.venv/
            - __pycache__/
            - *.pyc
            - *.log
            - suspicious root shell fragments such as %s, quote-prefixed names, or semicolon leftovers
            - 新建 文本文档.txt

          Blocked tracked paths:
          EOF
            printf '  - %s\n' "${forbidden[@]}"
            echo "Remove these paths from Git and keep them covered by .gitignore."
            exit 1
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked workflow lint toolchain
        run: npm --prefix frontend ci

      - name: Lint workflow YAML
        run: node scripts/validate-workflow-yaml.mjs

      - name: Validate dependency policy inputs
        run: |
          set -euo pipefail
          test -f frontend/package-lock.json
          if grep -R --line-number -E '[n]pm[[:space:]]+install([[:space:]]|$)' frontend/Dockerfile .github/workflows/ci.yml; then
            echo "::error title=Dependency policy::Use npm ci with frontend/package-lock.json; fallback frontend installs are not allowed"
            exit 1
          fi

      - name: Test ops fixtures
        run: npm run test:ops

  supply-chain-pin-gate:
    name: Supply chain pin gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enforce release supply-chain pins
        run: node scripts/check-supply-chain-pins.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-config:
    name: Deployment config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          tmp_env="$(mktemp)"
          cp .env.example "$tmp_env"
          {
            echo "NGINX_SERVER_NAME=colorfultibet.test www.colorfultibet.test"
            echo "NGINX_REDIRECT_HOST=colorfultibet.test"
            echo "NGINX_CERT_DOMAIN=colorfultibet.test"
            echo "ALERTMANAGER_WEBHOOK_URL=https://alerts.colorfultibet.test/webhook"
          } >> "$tmp_env"
          docker compose --env-file "$tmp_env" -f docker-compose.prod.yml config --quiet

      - name: Validate Prometheus configuration
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 \
            check rules /etc/prometheus/alert_rules.yml

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Flyway migration files
        run: |
          set -euo pipefail
          files="$(find src/main/resources/db/migration -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort -V)"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^V[0-9]+__[A-Za-z0-9_]+\.sql$' || true)"
          if [ -n "$invalid" ]; then
            echo "Invalid Flyway migration names:"
            printf '%s\n' "$invalid"
            exit 1
          fi
          duplicates="$(printf '%s\n' "$files" | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate Flyway migration versions:"
            printf 'V%s\n' $duplicates
            exit 1
          fi

      - name: Test backend
        run: mvn -q test

      - name: Dependency vulnerability scan
        id: backend_dependency_check
        continue-on-error: true
        timeout-minutes: 20
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn --batch-mode org.owasp:dependency-check-maven:12.2.2:check
          -DfailBuildOnCVSS=7
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -Dformat=ALL
          -Dodc.outputDirectory="$GITHUB_WORKSPACE/backend/target/dependency-check-report"

      - name: Upload backend dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-dependency-check-report
          path: backend/target/dependency-check-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Trivy filesystem scan
        id: backend_trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: backend
          format: sarif
          output: backend-trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload backend Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-trivy-fs-report
          path: backend-trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail backend security scans
        if: steps.backend_dependency_check.outcome == 'failure' || steps.backend_trivy_fs.outcome == 'failure'
        run: |
          # `continue-on-error` makes a timeout, an NVD outage, or a missing NVD_API_KEY (fork PRs)
          # land here with outcome=failure too. Only a scan that actually produced a report can be
          # reporting vulnerabilities; anything else is scan infrastructure and must not be dressed up
          # as a security finding - but it must not pass silently either.
          dependency_check_failed=0
          if [ "${{ steps.backend_dependency_check.outcome }}" = "failure" ]; then
            if [ -d backend/target/dependency-check-report ] \
              && [ -n "$(ls -A backend/target/dependency-check-report 2>/dev/null)" ]; then
              echo "::error::dependency-check reported findings at or above CVSS 7. Review the uploaded report."
              dependency_check_failed=1
            else
              echo "::warning::dependency-check did not complete (timeout, NVD outage, or missing NVD_API_KEY);\
           no report was produced, so no vulnerability conclusion can be drawn."
            fi
          fi

          if [ "${{ steps.backend_trivy_fs.outcome }}" = "failure" ]; then
            echo "::error::Trivy reported HIGH/CRITICAL findings. Review the uploaded SARIF report."
            exit 1
          fi

          exit "$dependency_check_failed"

  backend-context:
    name: Backend context boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: colorful_tibet_test
          MYSQL_USER: colorful_tibet_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Spring context, Flyway, and payment reservation locking against MySQL
        env:
          RUN_CONTEXT_TESTS: 'true'
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_DATABASE: colorful_tibet_test
          MYSQL_TEST_USERNAME: colorful_tibet_app
          MYSQL_TEST_PASSWORD: ci-app-password
          MYSQL_TEST_ALLOW_PUBLIC_KEY_RETRIEVAL: 'true'
        run: mvn -q test -Dtest=ApplicationContextSmokeTest

  api-contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate backend OpenAPI document
        run: mvn -q -f backend/pom.xml -Dtest=OpenApiContractGenerationTest test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Regenerate frontend API types
        run: npm --prefix frontend run generate:api-types

      - name: Reject stale generated API types
        run: git diff --exit-code -- frontend/src/api/generated/schema.d.ts

  scrapler:
    name: Scrapler tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapler
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scrapler/requirements.txt
            scrapler/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Test scrapler
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          test -f package-lock.json
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test frontend
        run: npm run test -- --run

      - name: Audit production dependencies
        # Browser/build tooling is not shipped in the nginx image; Trivy still scans the full
        # lockfile and applies the narrow, expiring exception in .trivyignore.yaml.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: frontend
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Test browser smoke
        run: npm run test:e2e

      - name: Upload browser smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  docker-images:
    name: Docker image build and scan
    runs-on: ubuntu-latest
    needs:
      - backend
      - scrapler
      - frontend
    env:
      CI_VITE_API_BASE_URL: /api
      CI_VITE_RECAPTCHA_ENABLED: 'true'
      CI_VITE_RECAPTCHA_MODE: v3
      CI_VITE_RECAPTCHA_SITE_KEY: ci-recaptcha-site-key
      CI_VITE_AMAP_KEY: ci-amap-web-key
      CI_VITE_AMAP_SECURITY_CODE: ci-amap-security-code
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend image
        run: docker build -t colorful-tibet-backend:ci ./backend

      - name: Build frontend image
        run: |
          set -euo pipefail
          docker build \
            --build-arg VITE_API_BASE_URL="$CI_VITE_API_BASE_URL" \
            --build-arg VITE_RECAPTCHA_ENABLED="$CI_VITE_RECAPTCHA_ENABLED" \
            --build-arg VITE_RECAPTCHA_MODE="$CI_VITE_RECAPTCHA_MODE" \
            --build-arg VITE_RECAPTCHA_SITE_KEY="$CI_VITE_RECAPTCHA_SITE_KEY" \
            --build-arg VITE_AMAP_KEY="$CI_VITE_AMAP_KEY" \
            --build-arg VITE_AMAP_SECURITY_CODE="$CI_VITE_AMAP_SECURITY_CODE" \
            -t colorful-tibet-frontend:ci ./frontend

      - name: Build scrapler image
        run: docker build -t colorful-tibet-scrapler:ci ./scrapler

      - name: Prepare SBOM output
        run: mkdir -p sbom

      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan scrapler image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-scrapler:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-backend:ci
          format: cyclonedx
          output: sbom/backend.cdx.json

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-frontend:ci
          format: cyclonedx
          output: sbom/frontend.cdx.json

      - name: Generate scrapler SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: colorful-tibet-scrapler:ci
          format: cyclonedx
          output: sbom/scrapler.cdx.json

      - name: Upload image SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-sboms
          path: sbom/*.cdx.json
          retention-days: 30
